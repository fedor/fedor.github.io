<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital@0;1&family=IBM+Plex+Sans:ital@0;1&family=IBM+Plex+Serif:ital@0;1&display=swap" rel="stylesheet">
		<link href="/style.css" rel="stylesheet" id="siteStylesheet">
		<noscript>
			<link href="/style.noscript.css" rel="stylesheet">
		</noscript>

		<!-- Global site tag (gtag.js) - Google Analytics -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=UA-155295044-1"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());
			gtag('config', 'UA-155295044-1');
		</script>
		<script type="text/javascript">
			const htmlClassList = document.getElementsByTagName("html")[0].classList
			function getPreferredColorScheme() {
				return (
					window.matchMedia("(prefers-color-scheme: dark)").matches
					? 'dark'
					: (window.matchMedia("(prefers-color-scheme: light)")
						? 'light'
						: undefined)
				)
			}

			function setColorScheme(scheme) {
				const preferedScheme = getPreferredColorScheme()
				const htmlDefinedScheme = htmlClassList.contains("dark") ? 'dark' : (htmlClassList.contains("light") ? 'light' : undefined)
				const activeScheme = htmlDefinedScheme || getPreferredColorScheme() || 'light'
				const inverseScheme = scheme === 'light'
					? 'dark'
					: (scheme === 'dark'
						? 'light'
						: htmlDefinedScheme || getPreferredColorScheme() || 'light')

					const colorSchemeToggleElement = document.getElementById("colorSchemeToggle")
				const mobileColorSchemeToggleElement = document.getElementById("mobileColorSchemeToggle")
					if (inverseScheme === 'light') {
					// Set 'dark' scheme
					if ('dark' === preferedScheme) {
						localStorage.removeItem('colorScheme')
					} else {
						localStorage.colorScheme = 'dark'
					}

					htmlClassList.remove('light')
					htmlClassList.add('dark')
						if (colorSchemeToggleElement) {
							colorSchemeToggleElement.setAttribute('aria-label', 'Light mode')
						}
					} else {
					// Set 'light' scheme
					if ('light' === preferedScheme) {
						localStorage.removeItem('colorScheme')
					} else {
						localStorage.colorScheme = 'light'
					}

					htmlClassList.remove('dark')
					htmlClassList.add('light')
						if (colorSchemeToggleElement) {
							colorSchemeToggleElement.setAttribute('aria-label', 'Dark mode')
						}
					}
			}

			window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (obj) {
				if (obj.matches) { setColorScheme(localStorage.colorScheme || 'dark') }
			})

			window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function (obj) {
				if (obj.matches) { setColorScheme(localStorage.colorScheme || 'light') }
			})

			// on page load
			setColorScheme(localStorage.colorScheme || getPreferredColorScheme())

			function setStylesEnabled(enabled) {
				const stylesheet = document.getElementById("siteStylesheet")
				if (!stylesheet) { return }
				stylesheet.disabled = !enabled
				localStorage.stylesEnabled = enabled ? 'true' : 'false'
				document.querySelectorAll('[data-style-only]').forEach((element) => {
					if (enabled) {
						element.removeAttribute('hidden')
					} else {
						element.setAttribute('hidden', '')
					}
				})
				document.querySelectorAll('[data-plain-only]').forEach((element) => {
					if (enabled) {
						element.setAttribute('hidden', '')
					} else {
						element.removeAttribute('hidden')
					}
				})
				setPlainMediaSizing(enabled)
				document.querySelectorAll('[data-style-toggle]').forEach((element) => {
					element.setAttribute('aria-pressed', enabled ? 'true' : 'false')
					element.setAttribute('aria-label', enabled ? 'Disable styles' : 'Enable styles')
				})
			}

			function setPlainMediaSizing(stylesEnabled) {
				const media = document.querySelectorAll('img, video')
				media.forEach((element) => {
					if (stylesEnabled) {
						const originalWidth = element.getAttribute('data-orig-width')
						if (originalWidth) {
							element.setAttribute('width', originalWidth)
							element.removeAttribute('data-orig-width')
						} else {
							element.removeAttribute('width')
						}
					} else {
						if (element.hasAttribute('width') && !element.getAttribute('data-orig-width')) {
							element.setAttribute('data-orig-width', element.getAttribute('width'))
						}
						const plainWidth = element.getAttribute('data-plain-width') || '320'
						element.setAttribute('width', plainWidth)
					}
				})
			}

			function toggleStyles() {
				const enabled = localStorage.stylesEnabled !== 'false'
				setStylesEnabled(!enabled)
			}

			const textSizeClasses = ['text-size-small', 'text-size-normal', 'text-size-large']
			function setTextSize(size) {
				const body = document.body
				if (!body) { return }
				textSizeClasses.forEach((className) => body.classList.remove(className))
				body.classList.add(`text-size-${size}`)
				localStorage.textSize = size
				const textSizeToggleElement = document.getElementById("textSizeToggle")
				if (textSizeToggleElement) {
					textSizeToggleElement.setAttribute('aria-label', `Text size: ${size}`)
				}
			}

			function cycleTextSize() {
				const currentSize = localStorage.textSize || 'normal'
				const sizes = ['small', 'normal', 'large']
				const currentIndex = sizes.indexOf(currentSize)
				const nextSize = sizes[(currentIndex + 1) % sizes.length]
				setTextSize(nextSize)
			}
		</script>
		<title>Fedor Korshunov</title>
	</head>
	<body class="
		page-bg
		dark:text-neutral-200 text-neutral-700

		font-sans antialiased
		
		min-h-screen
		
		flex flex-col
		justify-between

		text-size-small"
	>
		<div class="
			grow
			flex flex-col
			  md:flex-row"
		>
			<div
				id="sidebar"
				class="
					mt-8 mx-[1.65rem]
					md:mx-8
					md:mr-0
					md:min-w-max"
			>
				<div class="sticky top-8 z-50 relative">
					<div class="flex items-baseline justify-between gap-3">
						<a class="site-brand site-brand--stacked" href="/">
							<span>Fedor</span>
							<span>Korshunov</span>
						</a>
					</div>
					<div class="nav-popover">
						<label for="nav-toggle" class="nav-toggle" data-style-only hidden>≡</label>
						<input type="checkbox" id="nav-toggle" class="hidden" data-style-only hidden>
						<label for="nav-toggle" class="nav-overlay" data-style-only hidden></label>
					<nav class="site-nav">
						<ul>
							<li><a class="{{{nav_link_classes.index}}}"  href="/">About</a></li>
								<li><a class="{{{nav_link_classes.now}}}"    href="/now">Now</a></li>
								<li><a class="{{{nav_link_classes.work}}}"   href="/work">Work</a></li>
								<li><a class="{{{nav_link_classes.posts}}}"  href="/posts">Posts</a></li>
							</ul>	
						</nav>
					</div>
				</div>
			</div>

			<div
				id="content"
				class="
					flex flex-col
					my-8 mx-auto
					px-[1.65rem]
					md:px-[2.75rem]
					w-full max-w-screen-md"	
			>
				{{{content}}}
			</div>
		</div>

		<footer
			class="
				dark:bg-neutral-900 dark:text-neutral-500
				     bg-neutral-200      text-neutral-500
				
				text-base
				py-8
				border-t border-neutral-300/70 dark:border-neutral-700/70
				bg-gradient-to-b from-neutral-200 to-neutral-300
				dark:from-neutral-900 dark:to-neutral-950
			"
		>
			<div class="footer-links">
				<ul class="footer-links-list">
					<li><a class="dark:text-neutral-500 text-neutral-500" href="https://github.com/fedor">GitHub</a></li>
					<li><a class="dark:text-neutral-500 text-neutral-500" href="https://www.linkedin.com/in/fedorhk/">LinkedIn</a></li>
					<li>mail@fedor.cc</li>
				</ul>
				<div class="mode-controls">
					<button
						id="stylesToggle"
						class="style-toggle"
						type="button"
						onclick="toggleStyles()"
						aria-label="Disable styles"
						aria-pressed="true"
						data-style-toggle
					>CSS</button>
					<button
						id="textSizeToggle"
						class="text-size-toggle"
						type="button"
						onclick="cycleTextSize()"
						aria-label="Text size: small"
						data-style-only
						hidden
					>Aa</button>
					<button
						id="colorSchemeToggle"
						class="mode-toggle"
						type="button"
						onclick="setColorScheme()"
						aria-label="Toggle color scheme"
						data-style-only
						hidden
					></button>
				</div>
				<p class="footer-copy">©2026 Fedor Korshunov</p>
			</div>
		</footer>
	</body>
	<script type="text/javascript">
		setColorScheme(localStorage.colorScheme || getPreferredColorScheme())
		setStylesEnabled(localStorage.stylesEnabled !== 'false')
		setTextSize(localStorage.textSize || 'small')
	</script>
</html>
